<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="せどり検索">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>せどり一括検索</title>
<style>
  :root {
    --bg:#f3f4f6; --card:#fff; --text:#111827; --sub:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --chip:#eef2ff; --chip-text:#3730a3; --danger:#dc2626;
    --kbbg:#d1d5db; --key:#fff; --keyfn:#aeb4bd; --keyshadow:rgba(0,0,0,.35);
    --kbh: 0px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --line:#334155;
      --accent:#60a5fa; --chip:#312e81; --chip-text:#e0e7ff;
      --kbbg:#1f2937; --key:#4b5563; --keyfn:#374151; --keyshadow:rgba(0,0,0,.6); }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { touch-action:manipulation; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding-bottom:calc(var(--kbh) + 16px); -webkit-user-select:none; user-select:none; }
  input { -webkit-user-select:text; user-select:text; }

  /* ---- 検索欄 ---- */
  header { position:sticky; top:0; z-index:10; background:var(--card);
    border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top) + 8px) 10px 8px; }
  .searchRow { display:flex; gap:6px; }
  /* 長い文字も全部見えるよう、折り返して高さを自動で伸ばす */
  #q { flex:1; min-width:0; font-size:20px; line-height:1.3; padding:10px 12px; border:2px solid var(--accent);
    border-radius:12px; background:var(--bg); color:var(--text); font-family:inherit;
    resize:none; overflow-y:auto; max-height:6.8em; overflow-wrap:anywhere; display:block; }
  .searchRow { align-items:flex-start; }
  .iconBtn { height:50px; }
  input, textarea { -webkit-user-select:text; user-select:text; }
  #q:focus { outline:none; }
  .iconBtn { width:48px; flex:none; border:none; border-radius:12px; font-size:20px;
    background:var(--chip); color:var(--chip-text); }
  .iconBtn.listening { background:var(--danger); color:#fff; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }

  main { padding:10px; display:grid; gap:10px; max-width:720px; margin:0 auto; }
  section { background:var(--card); border-radius:14px; padding:10px; border:1px solid var(--line); }
  section h2 { font-size:13px; margin:0 0 8px; color:var(--sub); display:flex;
    justify-content:space-between; align-items:center; gap:8px; }

  /* ---- 検索サイト ---- */
  .sites { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .siteBtn { border:none; color:#fff; border-radius:10px; padding:8px 4px; min-height:54px;
    font-weight:700; font-size:15px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; line-height:1.2; }
  .siteBtn small { font-weight:400; font-size:10px; opacity:.9; margin-top:2px; }
  .siteBtn:disabled { opacity:.3; }
  .siteBtn.visited { box-shadow:0 0 0 3px var(--card), 0 0 0 5px var(--accent); }
  .soldToggle { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--text);
    padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:var(--bg); }
  .soldToggle input { margin:0; }

  /* ---- メーカー・履歴 ---- */
  .tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs button { flex:none; padding:5px 11px; border-radius:999px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); font-size:13px; }
  .tabs button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:none; border-radius:999px; padding:7px 11px; font-size:14px;
    background:var(--chip); color:var(--chip-text); }
  .chip .x { margin-left:6px; color:var(--danger); font-weight:700; }
  .smallBtn { font-size:12px; padding:4px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); }
  .addRow { display:flex; gap:6px; margin-top:8px; }
  .addRow input { flex:1; min-width:0; padding:8px; font-size:16px; border-radius:8px;
    border:1px solid var(--line); background:var(--bg); color:var(--text); }
  .hint { font-size:11px; color:var(--sub); margin:6px 0 0; line-height:1.5; }
  .empty { color:var(--sub); font-size:13px; }
  details summary { font-size:13px; color:var(--sub); cursor:pointer; }
  .setRow { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; align-items:center; font-size:13px; }
  .setRow label { display:inline-flex; align-items:center; gap:4px; padding:5px 9px;
    border-radius:999px; border:1px solid var(--line); background:var(--bg); }

  /* ---- 利益計算 ---- */
  .calc { display:grid; gap:8px; }
  .calc label { display:flex; justify-content:space-between; align-items:center; font-size:15px; }
  .calc label span { display:flex; align-items:center; gap:6px; }
  .calc input { width:130px; font-size:20px; text-align:right; padding:8px 10px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg); color:var(--text); font-family:inherit; }
  .calc input.short { width:70px; }
  .calc .minus { font-weight:400; font-size:13px; color:var(--sub); min-width:70px; text-align:right; }
  .profitRow { display:flex; justify-content:space-between; align-items:center; border-top:2px solid var(--line);
    padding-top:8px; font-size:16px; font-weight:700; }
  #cProfit { font-size:28px; color:#16a34a; }
  #cProfit.neg { color:var(--danger); }

  /* ---- 画面キーボード ---- */
  .kb { position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--kbbg);
    padding:6px 3px calc(env(safe-area-inset-bottom) + 6px); }
  .kb[hidden] { display:none; }
  .kgrid { display:grid; grid-template-columns:repeat(10, 1fr); gap:5px 4px; max-width:720px; margin:0 auto; }
  .kgrid + .kgrid { margin-top:5px; }
  .key { height:40px; border:none; border-radius:6px; background:var(--key); color:var(--text);
    font-size:19px; padding:0; box-shadow:0 1px 0 var(--keyshadow); font-family:inherit; }
  .key.fn { background:var(--keyfn); font-size:13px; }
  .key.on { background:var(--accent); color:#fff; }
  .key.blank { visibility:hidden; }
  .key.pressed { background:var(--accent); color:#fff; }
  .floatKb { position:fixed; right:12px; bottom:calc(env(safe-area-inset-bottom) + 12px); z-index:20;
    border:none; border-radius:999px; padding:12px 16px; font-size:15px; font-weight:700;
    background:var(--accent); color:#fff; box-shadow:0 4px 12px rgba(0,0,0,.3); }
  .floatKb[hidden] { display:none; }
</style>
</head>
<body>
<header>
  <form class="searchRow" id="form" autocomplete="off">
    <textarea id="q" rows="1" inputmode="none" enterkeyhint="search" placeholder="商品名・型番など"
      autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    <button type="button" class="iconBtn" id="mic" aria-label="音声入力">🎤</button>
    <button type="button" class="iconBtn" id="clear" aria-label="クリア">✕</button>
  </form>
</header>

<main>
  <section>
    <h2><span id="qLabel">検索語を入力してください</span>
      <label class="soldToggle"><input type="checkbox" id="sold"> 売り切れで検索</label></h2>
    <div class="sites" id="sites"></div>
    <p class="hint">調べたいサイトをタップするとそのサイトの検索結果へ移動します。戻ると入力した文字はそのまま残ります。</p>
  </section>

  <section>
    <h2>メーカー・ブランド <button class="smallBtn" id="editBrands">編集</button></h2>
    <div class="tabs" id="cats"></div>
    <div class="chips" id="brands"></div>
    <div class="addRow" id="addRow" hidden>
      <input id="newBrand" placeholder="追加するメーカー名">
      <button class="smallBtn" id="addBrand">追加</button>
    </div>
    <p class="hint">タップ＝検索欄に追加／長押し＝検索欄を置き換え</p>
  </section>

  <section>
    <h2>検索履歴 <button class="smallBtn" id="clearHist">消去</button></h2>
    <div class="chips" id="hist"></div>
  </section>

  <section>
    <h2>利益計算 <button class="smallBtn" id="calcReset">手数料・送料を初期値に</button></h2>
    <div class="calc">
      <label>販売価格<span><input id="cSell" inputmode="numeric" placeholder="0"> 円</span></label>
      <label>手数料<span><input id="cRate" inputmode="decimal" class="short"> % <b id="cFee" class="minus">−0 円</b></span></label>
      <label>送料<span><input id="cShip" inputmode="numeric"> 円</span></label>
      <div class="profitRow">利益 <output id="cProfit">0 円</output></div>
    </div>
  </section>

  <section>
    <details>
      <summary>設定</summary>
      <div class="setRow">使うサイト：<span id="siteToggles" style="display:contents"></span></div>
      <div class="setRow">サイトの開き方：
        <label><input type="radio" name="openMode" value="same"> この画面で移動</label>
        <label><input type="radio" name="openMode" value="tab"> 新しいタブ</label></div>
      <div class="setRow">50音の並び：
        <label><input type="radio" name="kanaOrder" value="ltr"> あ が左</label>
        <label><input type="radio" name="kanaOrder" value="rtl"> あ が右（カーナビ式）</label></div>
    </details>
  </section>
</main>

<!-- 画面キーボード -->
<div class="kb" id="kb">
  <div class="kgrid" id="kbMain"></div>
  <div class="kgrid" id="kbFn"></div>
  <div class="kgrid" id="kbBottom"></div>
</div>
<button class="floatKb" id="floatKb" hidden>⌨ キーボード</button>

<script>
// ================= 検索サイト =================
const enc = s => encodeURIComponent(s);
const SITES = [
  { id:'mercari', name:'メルカリ', color:'#e60012',
    url: q => `https://jp.mercari.com/search?keyword=${enc(q)}`,
    sold: q => `https://jp.mercari.com/search?keyword=${enc(q)}&status=sold_out` },
  { id:'yahuoku', name:'ヤフオク', color:'#d97706',
    url: q => `https://auctions.yahoo.co.jp/search/search?p=${enc(q)}`,
    sold: q => `https://auctions.yahoo.co.jp/closedsearch/closedsearch?p=${enc(q)}` },
  { id:'yfrima', name:'Yahoo!フリマ', color:'#ff0033',
    url: q => `https://paypayfleamarket.yahoo.co.jp/search/${enc(q)}`,
    sold: null }, // URLでの売り切れ絞り込み不可（サイト上の「販売状況」で絞る）
  { id:'rakuma', name:'ラクマ', color:'#c2185b',
    url: q => `https://fril.jp/s?query=${enc(q)}`,
    sold: q => `https://fril.jp/s?query=${enc(q)}&transaction=soldout` },
  { id:'aucfan', name:'オークファン', color:'#0f766e',
    url: q => `https://aucfan.com/search1/q-~${eucHex(q)}/`,
    sold: q => `https://aucfan.com/search1/q-~${eucHex(q)}/` },
];

// オークファンは検索語を EUC-JP の16進数でURLに入れる必要がある。
// ブラウザには EUC-JP エンコーダが無いので、デコーダから逆引き表を作る。
let eucMap = null;
function eucHex(s) {
  if (!eucMap) {
    eucMap = new Map();
    const d = new TextDecoder('euc-jp');
    for (let a = 0xa1; a <= 0xfe; a++) for (let b = 0xa1; b <= 0xfe; b++) {
      const c = d.decode(new Uint8Array([a, b]));
      if (c.length === 1 && c !== '�' && !eucMap.has(c)) eucMap.set(c, a.toString(16) + b.toString(16));
    }
  }
  return [...s].map(ch => {
    const c = ch.codePointAt(0);
    if (c < 0x80) return c.toString(16).padStart(2, '0');
    return eucMap.get(ch) || '';
  }).join('');
}

const DEFAULT_BRANDS = {
  'バッグ': ['LONGCHAMP','PORTER','COACH','agnes b. VOYAGE','Herve Chapelier','marimekko','STATE OF ESCAPE','カステルバジャック','PRADA'],
  'レディース': ['TOCCA','23区','FOXEY','PLEATS PLEASE','JIL SANDER','SEA NEW YORK',"Alessandro dell'Acqua",'バーバリーブルーレーベル','エムズグレイシー','YOKO CHAN','ANAYI','自由区','Krone','Barbaro'],
  'スポーツ': ['THE NORTH FACE','patagonia','Columbia','NIKE','adidas','Ralph Lauren','Champion','BURBERRY','STUSSY','Carhartt','Supreme','A BATHING APE'],
  '靴': ['DIANA','REGAL','NIKE','adidas','New Balance'],
  '時計': ['G-SHOCK','SEIKO','CITIZEN','CASIO'],
  '家電・ホビー': ['SONY','Panasonic','Nintendo','BANDAI','タカラトミー','Canon','Nikon','dyson'],
  'キーワード': ['ワンピース','ショルダーバッグ','トートバッグ','ダウン','フリース','パンプス','未使用','タグ付き','美品'],
};

// ================= 保存 =================
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let brands   = store.get('brands', DEFAULT_BRANDS);
let enabled  = store.get('enabled', Object.fromEntries(SITES.map(s => [s.id, true])));
let history  = store.get('history', []);
let cat      = store.get('cat', Object.keys(brands)[0]);
let openMode = store.get('openMode', 'same');
let kanaOrder = store.get('kanaOrder', 'ltr');
let editMode = false;

const $ = id => document.getElementById(id);
const qEl = $('q'), soldEl = $('sold');
soldEl.checked = store.get('sold', false);
qEl.value = store.get('lastQ', '');

// 全角英数→半角・半角カナ→全角に揃える
const query = () => qEl.value.normalize('NFKC').trim().replace(/\s+/g, ' ');
const linkFor = s => (soldEl.checked && s.sold ? s.sold : s.url)(query());
const visitedIds = () => { const v = store.get('visited', {}); return v.q === query() ? v.ids : []; };

// 入力欄の高さを文字量に合わせる（最大5行、それ以上はスクロール）
function autosize() {
  qEl.style.height = 'auto';
  qEl.style.height = qEl.scrollHeight + 4 + 'px';
  qEl.scrollTop = qEl.scrollHeight; // 末尾（今入力した文字）を見せる
}
function changed() {
  store.set('lastQ', qEl.value);
  autosize();
  renderSites();
}
// iPhoneキーボードの「検索」(改行)では改行せずキーボードを閉じる
qEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); qEl.blur(); } });

// ================= 検索サイトボタン =================
function renderSites() {
  const q = query(), vis = visitedIds();
  $('qLabel').textContent = q ? `「${q}」を調べる` : '検索語を入力してください';
  $('sites').innerHTML = '';
  SITES.filter(s => enabled[s.id]).forEach(s => {
    const b = document.createElement('button');
    b.className = 'siteBtn' + (vis.includes(s.id) ? ' visited' : '');
    b.style.background = s.color;
    b.disabled = !q;
    const label = s.id === 'aucfan' ? '過去相場'
      : !soldEl.checked ? '販売中'
      : s.sold ? '売り切れ' : '販売中※';
    b.innerHTML = `${s.name}<small>${label}</small>`;
    b.onclick = () => go(s);
    $('sites').appendChild(b);
  });
}

function go(s) {
  const q = query(); if (!q) return;
  addHistory(q);
  store.set('visited', { q, ids: [...new Set([...visitedIds(), s.id])] });
  const url = linkFor(s);
  renderSites();
  if (openMode === 'tab') window.open(url, '_blank');
  else location.href = url;
}

soldEl.addEventListener('change', () => { store.set('sold', soldEl.checked); renderSites(); });
$('form').addEventListener('submit', e => { e.preventDefault(); qEl.blur(); });
qEl.addEventListener('input', changed);
$('clear').addEventListener('click', () => { qEl.value = ''; changed(); });
// ブラウザの「戻る」でキャッシュから復帰したとき
window.addEventListener('pageshow', () => { qEl.value = store.get('lastQ', qEl.value); renderSites(); });

// ================= 音声入力 =================
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
$('mic').addEventListener('click', () => {
  if (!SR) {
    alert('この画面では音声入力が使えません。キーボードの「iPhone」に切り替えて、iPhoneキーボードのマイクで話してください。');
    return;
  }
  if (rec) { rec.stop(); return; }
  rec = new SR();
  rec.lang = 'ja-JP'; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => {
    const t = e.results[0][0].transcript.replace(/[。、]/g, ' ').trim();
    qEl.value = (query() ? query() + ' ' : '') + t;
    changed();
  };
  rec.onerror = e => { if (e.error === 'not-allowed') alert('マイクの使用が許可されていません。iPhoneの設定 → Safari → マイク を確認してください。'); };
  rec.onend = () => { rec = null; $('mic').classList.remove('listening'); };
  $('mic').classList.add('listening');
  rec.start();
});

// ================= 画面キーボード =================
const KANA_COLS = ['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの',
                   'はひふへほ','まみむめも','や ゆ よ','らりるれろ','わをんー '];
const pairMap = str => { const m = {}; for (let i = 0; i < str.length; i += 2) { m[str[i]] = str[i+1]; m[str[i+1]] = str[i]; } return m; };
const VOICED = pairMap('かがきぎくぐけげこごさざしじすずせぜそぞただちぢつづてでとどはばひびふぶへべほぼうゔ');
const SEMI   = pairMap('はぱひぴふぷへぺほぽ');
const SMALL  = pairMap('あぁいぃうぅえぇおぉつっやゃゆゅよょわゎ');
const toHira = c => { const n = c.charCodeAt(0); return n >= 0x30a1 && n <= 0x30f6 ? String.fromCharCode(n - 0x60) : c; };
const toKata = c => { const n = c.charCodeAt(0); return n >= 0x3041 && n <= 0x3096 ? String.fromCharCode(n + 0x60) : c; };

let kbMode = store.get('kbMode', 'kana');   // kana | abc | native
let katakana = store.get('katakana', true); // ブランド名はカタカナが多いので既定はカナ
let upper = true;

function caret() {
  const v = qEl.value;
  if (document.activeElement !== qEl || qEl.selectionStart == null) return [v.length, v.length];
  return [qEl.selectionStart, qEl.selectionEnd];
}
function setCaret(p) { if (document.activeElement === qEl) qEl.setSelectionRange(p, p); }
function insert(t) {
  const v = qEl.value, [s, e] = caret();
  qEl.value = v.slice(0, s) + t + v.slice(e);
  setCaret(s + t.length); changed();
}
function backspace() {
  const v = qEl.value, [s, e] = caret();
  if (s !== e) { qEl.value = v.slice(0, s) + v.slice(e); setCaret(s); }
  else if (s > 0) { qEl.value = v.slice(0, s - 1) + v.slice(s); setCaret(s - 1); }
  changed();
}
// 直前の1文字を濁点・半濁点・小文字に切り替える
function modifyPrev(kind) {
  const v = qEl.value, [s] = caret(); if (s === 0) return;
  const c = v[s - 1], kata = c !== toHira(c), h = toHira(c);
  let r = null;
  if (kind === 'voiced') r = VOICED[h] || ({ぱ:'ば',ぴ:'び',ぷ:'ぶ',ぺ:'べ',ぽ:'ぼ'})[h];
  if (kind === 'semi')   r = SEMI[h]   || ({ば:'ぱ',び:'ぴ',ぶ:'ぷ',べ:'ぺ',ぼ:'ぽ'})[h];
  if (kind === 'small')  r = SMALL[h];
  if (!r) return;
  if (kata) r = toKata(r);
  qEl.value = v.slice(0, s - 1) + r + v.slice(s);
  setCaret(s); changed();
}

// キー定義: {label, act, span, cls}
function k(label, act, opt = {}) { return { label, act, ...opt }; }
function kanaKeys() {
  const cols = kanaOrder === 'rtl' ? [...KANA_COLS].reverse() : KANA_COLS;
  const keys = [];
  for (let r = 0; r < 5; r++) for (let c = 0; c < 10; c++) {
    const ch = cols[c][r];
    if (!ch || ch === ' ') { keys.push(k('', null, { cls:'blank' })); continue; }
    const out = katakana && ch !== 'ー' ? toKata(ch) : ch;
    keys.push(k(out, () => insert(out)));
  }
  return keys;
}
function kanaFnKeys() {
  return [
    k(katakana ? 'カナ→ひら' : 'ひら→カナ', () => { katakana = !katakana; store.set('katakana', katakana); renderKb(); }, { span:2, cls:'fn' }),
    k('゛', () => modifyPrev('voiced'), { cls:'fn' }),
    k('゜', () => modifyPrev('semi'), { cls:'fn' }),
    k('小', () => modifyPrev('small'), { cls:'fn' }),
    k('空白', () => insert(' '), { span:3, cls:'fn' }),
    k('⌫', backspace, { span:2, cls:'fn', repeat:true }),
  ];
}
function abcKeys() {
  const L = s => [...s].map(ch => { const o = upper ? ch : ch.toLowerCase(); return k(o, () => insert(o)); });
  return [
    ...L('1234567890'),
    ...L('QWERTYUIOP'),
    ...L('ASDFGHJKL'), k('-', () => insert('-')),
    k('⇧', () => { upper = !upper; renderKb(); }, { cls: 'fn' + (upper ? ' on' : '') }),
    ...L('ZXCVBNM'), k('.', () => insert('.')), k('⌫', backspace, { cls:'fn', repeat:true }),
  ];
}
function abcFnKeys() {
  return [
    k('&', () => insert('&')), k("'", () => insert("'")), k('/', () => insert('/')),
    k('空白', () => insert(' '), { span:5, cls:'fn' }),
    k('+', () => insert('+')), k('#', () => insert('#')),
  ];
}
function bottomKeys() {
  const tab = (label, mode) => k(label, () => setKbMode(mode), { span:2, cls:'fn' + (kbMode === mode ? ' on' : '') });
  return [
    tab('あいう', 'kana'), tab('ABC 123', 'abc'), tab('iPhone', 'native'),
    k('全消去', () => { qEl.value = ''; changed(); }, { span:2, cls:'fn' }),
    k('▼ 閉じる', () => setKbMode('hidden'), { span:2, cls:'fn' }),
  ];
}

function fillGrid(el, keys) {
  el.innerHTML = '';
  keys.forEach(key => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'key ' + (key.cls || '');
    b.textContent = key.label;
    if (key.span) b.style.gridColumn = `span ${key.span}`;
    if (key.act) bindKey(b, key);
    el.appendChild(b);
  });
}
// pointerdown で即反応（入力欄のフォーカス・カーソルを失わないよう preventDefault）
function bindKey(b, key) {
  let t1, t2;
  const stop = () => { clearTimeout(t1); clearInterval(t2); b.classList.remove('pressed'); };
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    b.classList.add('pressed');
    key.act();
    if (key.repeat) t1 = setTimeout(() => { t2 = setInterval(key.act, 70); }, 400);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
  b.addEventListener('contextmenu', e => e.preventDefault());
}

function renderKb() {
  if (kbMode === 'kana') { fillGrid($('kbMain'), kanaKeys()); fillGrid($('kbFn'), kanaFnKeys()); }
  if (kbMode === 'abc')  { fillGrid($('kbMain'), abcKeys());  fillGrid($('kbFn'), abcFnKeys()); }
  fillGrid($('kbBottom'), bottomKeys());
  updateKbHeight();
}
function updateKbHeight() {
  const h = $('kb').hidden ? 70 : $('kb').offsetHeight;
  document.documentElement.style.setProperty('--kbh', h + 'px');
}
function setKbMode(mode) {
  if (mode === 'native') {
    // iPhone標準キーボード（漢字変換・音声入力用）
    kbMode = 'native'; store.set('kbMode', 'native');
    $('kb').hidden = true; $('floatKb').hidden = false;
    qEl.setAttribute('inputmode', 'search');
    qEl.blur(); setTimeout(() => qEl.focus(), 0);
  } else if (mode === 'hidden') {
    $('kb').hidden = true; $('floatKb').hidden = false;
    qEl.blur();
  } else {
    kbMode = mode; store.set('kbMode', mode);
    qEl.setAttribute('inputmode', 'none');
    qEl.blur();
    $('kb').hidden = false; $('floatKb').hidden = true;
    renderKb();
  }
  updateKbHeight();
}
$('floatKb').addEventListener('click', () => setKbMode(kbMode === 'native' ? 'kana' : kbMode));
// 画面キーボード使用中に入力欄をタップしたら閉じていたキーボードを出す
qEl.addEventListener('focus', () => { if (kbMode !== 'native' && $('kb').hidden) setKbMode(kbMode); });

// ================= メーカー簡単入力 =================
function renderCats() {
  if (!brands[cat]) cat = Object.keys(brands)[0];
  $('cats').innerHTML = '';
  Object.keys(brands).forEach(c => {
    const b = document.createElement('button');
    b.textContent = c; if (c === cat) b.className = 'active';
    b.onclick = () => { cat = c; store.set('cat', c); renderCats(); };
    $('cats').appendChild(b);
  });
  renderBrands();
}
function insertWord(w, replace) {
  qEl.value = replace || !query() ? w : `${query()} ${w}`;
  changed();
}
function renderBrands() {
  $('brands').innerHTML = '';
  (brands[cat] || []).forEach((name, i) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = name;
    if (editMode) {
      const x = document.createElement('span'); x.className = 'x'; x.textContent = '×'; b.appendChild(x);
      b.onclick = () => { brands[cat].splice(i, 1); store.set('brands', brands); renderBrands(); };
    } else {
      let timer, long = false;
      b.addEventListener('pointerdown', () => { long = false; timer = setTimeout(() => { long = true; insertWord(name, true); }, 500); });
      ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, () => clearTimeout(timer)));
      b.addEventListener('click', () => { if (!long) insertWord(name, false); });
      b.addEventListener('contextmenu', e => e.preventDefault());
    }
    $('brands').appendChild(b);
  });
}
$('editBrands').onclick = () => {
  editMode = !editMode;
  $('editBrands').textContent = editMode ? '完了' : '編集';
  $('addRow').hidden = !editMode;
  renderBrands();
};
$('addBrand').onclick = () => {
  const v = $('newBrand').value.trim(); if (!v) return;
  (brands[cat] ||= []).push(v); store.set('brands', brands);
  $('newBrand').value = ''; renderBrands();
};

// ================= 履歴 =================
function addHistory(q) {
  if (!q) return;
  history = [q, ...history.filter(h => h !== q)].slice(0, 30);
  store.set('history', history); renderHistory();
}
function renderHistory() {
  $('hist').innerHTML = history.length ? '' : '<span class="empty">まだありません</span>';
  history.forEach(h => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = h;
    b.onclick = () => insertWord(h, true);
    $('hist').appendChild(b);
  });
}
$('clearHist').onclick = () => { history = []; store.set('history', history); renderHistory(); };

// ================= 利益計算 =================
// 利益 = 販売価格 − 手数料(販売価格×率、1円未満切り捨て) − 送料
const CALC_DEFAULT = { rate: '10', ship: '1000' };
const calcIn = { sell: $('cSell'), rate: $('cRate'), ship: $('cShip') };
const calcSaved = store.get('calc', { sell: '', ...CALC_DEFAULT });
Object.keys(calcIn).forEach(k => { calcIn[k].value = calcSaved[k] ?? CALC_DEFAULT[k] ?? ''; });
const num = el => {
  const v = parseFloat(el.value.normalize('NFKC').replace(/[^\d.]/g, ''));
  return isFinite(v) ? v : 0;
};
const yen = n => n.toLocaleString('ja-JP') + ' 円';
function calc() {
  const sell = num(calcIn.sell), fee = Math.floor(sell * num(calcIn.rate) / 100), ship = num(calcIn.ship);
  const profit = sell - fee - ship;
  $('cFee').textContent = '−' + yen(fee);
  $('cProfit').textContent = sell ? yen(profit) : '— 円'; // 販売価格が未入力の間は計算しない
  $('cProfit').classList.toggle('neg', !!sell && profit < 0);
  store.set('calc', Object.fromEntries(Object.entries(calcIn).map(([k, el]) => [k, el.value])));
}
Object.values(calcIn).forEach(el => {
  el.addEventListener('input', calc);
  // 数字入力中は画面キーボードを下げて iPhone のテンキーを使う
  el.addEventListener('focus', () => { if (!$('kb').hidden) setKbMode('hidden'); el.select(); });
});
$('calcReset').onclick = () => { calcIn.rate.value = CALC_DEFAULT.rate; calcIn.ship.value = CALC_DEFAULT.ship; calc(); };
calc();

// ================= 設定 =================
function renderSettings() {
  $('siteToggles').innerHTML = '';
  SITES.forEach(s => {
    const l = document.createElement('label');
    const c = document.createElement('input'); c.type = 'checkbox'; c.checked = !!enabled[s.id];
    c.onchange = () => { enabled[s.id] = c.checked; store.set('enabled', enabled); renderSites(); };
    l.append(c, s.name); $('siteToggles').appendChild(l);
  });
  document.querySelectorAll('input[name=openMode]').forEach(r => {
    r.checked = r.value === openMode;
    r.onchange = () => { openMode = r.value; store.set('openMode', openMode); };
  });
  document.querySelectorAll('input[name=kanaOrder]').forEach(r => {
    r.checked = r.value === kanaOrder;
    r.onchange = () => { kanaOrder = r.value; store.set('kanaOrder', kanaOrder); if (kbMode === 'kana') renderKb(); };
  });
}

renderSites(); renderCats(); renderHistory(); renderSettings(); autosize();
setKbMode(kbMode === 'native' ? 'kana' : kbMode); // 起動時は画面キーボードで開始
window.addEventListener('resize', updateKbHeight);
</script>
